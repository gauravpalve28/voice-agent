server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api requests to the backend service.
    # This covers both regular HTTP (REST) and WebSocket (voice call) traffic.
    # In Docker Compose the backend is reachable via the service name "backend".
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Required headers for WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client information to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived WebSocket voice connections open (1 hour)
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # React SPA — serve index.html for any path not matched above
    # (enables client-side routing to work after a page refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
